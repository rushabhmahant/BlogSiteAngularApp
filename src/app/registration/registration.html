<div class="registration-container">
  <div class="registration-card">
    <h2 class="registration-title">Create Account</h2>
    <p class="registration-subtitle">Join our blogging community today</p>

    <form class="registration-form" [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" formControlName="username" placeholder="Enter your name" 
        [class.error]="registrationForm.get('username')?.touched && registrationForm.get('username')?.invalid"/>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" formControlName="email" placeholder="Enter your email" 
        [class.error]="registrationForm.get('email')?.touched && registrationForm.get('email')?.invalid"/>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" formControlName="password" placeholder="Enter your password" 
        [class.error]="registrationForm.get('password')?.touched && registrationForm.get('password')?.invalid"/>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-input" formControlName="confirmPassword" placeholder="Confirm your password" 
        [class.error]="registrationForm.get('confirmPassword')?.touched && registrationForm.get('confirmPassword')?.invalid"/>
      </div>

      <button class="btn btn-register" type="submit">Create Account</button>
    </form>

    <div class="registration-footer">
      <p>Already have an account? <a href="/login" class="login-link">Sign In</a></p>
    </div>
  </div>
</div>

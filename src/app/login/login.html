<div class="login-container">
  <div class="login-card">
    <h2 class="login-title">Welcome Back</h2>
    <p class="login-subtitle">Sign in to continue your blogging journey</p>

    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input 
          type="email" 
          class="form-input"
          [class.error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
          formControlName="email" 
          placeholder="Enter your email" />
        <div 
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" 
          class="error-message">
          Valid email is required
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input 
          type="password" 
          class="form-input"
          [class.error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          formControlName="password" 
          placeholder="Enter your password" />
        <div 
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" 
          class="error-message">
          Password is required
        </div>
      </div>

      <button class="btn btn-login" type="submit" [disabled]="loginForm.invalid">Sign In</button>
    </form>

    <div class="login-footer">
      <p>Don't have an account? <a href="/register" class="register-link">Create Account</a></p>
      <a href="#" class="forgot-password">Forgot Password?</a>
    </div>
  </div>
</div>

<div class="main-container">

  <!-- Header -->
  <header class="header">
    <div class="header-title" (click)="goToHomePage()" style="cursor: pointer;">BlogSite</div>

    <div>
      <!-- Show Login and Register buttons when NOT logged in -->
      <ng-container *ngIf="!isLoggedIn()">
        <button class="btn btn-login" (click)="goToLoginPage()">Login</button>
        <button class="btn btn-register" (click)="goToRegisterPage()">Register</button>
      </ng-container>

      <!-- Show My Blogs and Logout buttons when logged in -->
      <ng-container *ngIf="isLoggedIn()">
        <button class="btn btn-my-blogs" (click)="goToBlogList()">My Blogs</button>
        <button class="btn btn-logout" (click)="logout()">Logout</button>
      </ng-container>
    </div>
  </header>

  <!-- Route Outlet -->
  <router-outlet></router-outlet>

  <!-- Footer -->
  <footer class="footer">
    © 2025 BlogSite — Crafted for creators and storytellers.
  </footer>
</div>
